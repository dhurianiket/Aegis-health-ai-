name: Nightly smoke

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE20: true

on:
  workflow_run:
    workflows: ["Deploy Aegis Health AI to Firebase Hosting"]
    types:
      - completed
  schedule:
    - cron: '0 1 * * *' # 01:00 UTC nightly

jobs:
  smoke-test:
    if: ${{ github.event_name == 'schedule' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2
      
      - name: Setup Node.js
        uses: actions/setup-node@v4.4.0
        with:
          node-version: '22'
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4.2.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Wait for CDN propagation
        run: sleep 10

      - name: Run Playwright tests
        run: npx playwright test tests/e2e/smoke.spec.ts
        env:
          VITE_GEMINI_API_KEY: ${{ secrets.VITE_GEMINI_API_KEY }}
          TEST_TARGET_URL: https://aegis-health-app-90697.web.app
          
      - name: Notify on failure
        if: failure()
        run: echo "Smoke test failed. Please check the logs."
