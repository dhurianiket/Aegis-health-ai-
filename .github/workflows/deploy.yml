name: Deploy Aegis Health AI to Firebase Hosting

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE20: true

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Resolve CodeQL alert: Explicitly define minimum permissions
permissions:
  contents: read

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@v4.4.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_MEASUREMENT_ID: ${{ secrets.VITE_FIREBASE_MEASUREMENT_ID }}
          VITE_FIREBASE_DATABASE_URL: ${{ secrets.VITE_FIREBASE_DATABASE_URL }}
          VITE_EDGE_API_URL: ${{ secrets.VITE_EDGE_API_URL }}
          # VITE_GEMINI_API_KEY removed from SPA build — Gemini via edge Worker
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          VITE_RECAPTCHA_SITE_KEY: ${{ secrets.VITE_RECAPTCHA_SITE_KEY }}
          GOOGLE_MAPS_PLATFORM_KEY: ${{ secrets.GOOGLE_MAPS_PLATFORM_KEY }}
          VITE_GOOGLE_MAPS_PLATFORM_KEY: ${{ secrets.GOOGLE_MAPS_PLATFORM_KEY }}
          VITE_FEEDBACK_FORM_ID: ${{ secrets.VITE_FEEDBACK_FORM_ID }}
          VITE_ADMIN_FEEDBACK_FORM_ID: ${{ secrets.VITE_ADMIN_FEEDBACK_FORM_ID }}
          VITE_VISIT_PREP_FORM_ID: ${{ secrets.VITE_VISIT_PREP_FORM_ID }}
          VITE_GA_MEASUREMENT_ID: ${{ secrets.VITE_GA_MEASUREMENT_ID }}

      - name: Ensure Secrets in Google Cloud Secret Manager
        env:
          GCP_SA_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          RESEND_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          if [ -n "$RESEND_KEY" ] && [ -n "$GCP_SA_KEY" ]; then
            echo "$GCP_SA_KEY" > /tmp/gcp_sa_key.json
            gcloud auth activate-service-account --key-file=/tmp/gcp_sa_key.json
            PROJECT_ID="aegis-health-app-90697"
            if ! gcloud secrets describe RESEND_API_KEY --project="$PROJECT_ID" >/dev/null 2>&1; then
              echo "Creating RESEND_API_KEY in Google Cloud Secret Manager..."
              echo -n "$RESEND_KEY" | gcloud secrets create RESEND_API_KEY --data-file=- --project="$PROJECT_ID" --replication-policy=automatic
            else
              echo "Updating RESEND_API_KEY version in Google Cloud Secret Manager..."
              echo -n "$RESEND_KEY" | gcloud secrets add-version RESEND_API_KEY --data-file=- --project="$PROJECT_ID"
            fi
            # Ensure Cloud Functions runtime service account has secret accessor permission
            gcloud secrets add-iam-policy-binding RESEND_API_KEY \
              --project="$PROJECT_ID" \
              --member="serviceAccount:${PROJECT_ID}@appspot.gserviceaccount.com" \
              --role="roles/secretmanager.secretAccessor" || true
            rm -f /tmp/gcp_sa_key.json
          fi

      - name: Deploy to Firebase Hosting, Functions, and Firestore Rules
        uses: w9jds/firebase-action@844c33e381350ae5c600052ba95188f40572d8e0
        with:
          args: deploy --only hosting,functions,firestore:rules --force
        env:
          GCP_SA_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
