# ggshield / GitGuardian configuration
# Docs: https://docs.gitguardian.com/ggshield-docs/reference/gitguardian-yaml
#
# Keep ignores NARROW. Never blanket-ignore src/, tests/ or real env files:
# a committed .env.local must be caught, not silenced.
version: 2
secret:
  ignored_paths:
    # Dependencies and build output (generated, never hand-edited)
    - "**/node_modules/**"
    - "dist/**"
    - "build/**"
    - "functions/lib/**"
    - "coverage/**"
    # Generated knowledge-graph artefacts
    - "graphify-out/**"
    - ".graphify/**"
    # Template with empty placeholders / public-by-design site keys only
    - ".env.example"
