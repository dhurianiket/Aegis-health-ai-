<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <title>Aegis Health AI - Your Medical Companion</title>
    <meta name="description" content="Aegis Health AI is an independent, AI-powered health technology platform built for Indian families. Proudly developed in Dombivli, Maharashtra, India. Not affiliated with Aegis Health Ai Ltd (UK)." />
    <meta name="author" content="Aniket Dhuri" />
    <meta name="founder-background" content="Professional Video Editor and Entrepreneur" />
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Aegis Health">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <link rel="manifest" href="/manifest.json" />
    <link rel="preconnect" href="https://api.fontshare.com" crossorigin />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700,900&display=swap"
      rel="stylesheet"
    />
    <!-- Google Tag (gtag.js) - Google Analytics GA4 -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-KKGF16H7CY"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      window.gtag = gtag;
      gtag('js', new Date());

      gtag('config', 'G-KKGF16H7CY', {
        send_page_view: true
      });
    </script>
  </head>
  <body style="background-color: #0d0d0d; margin: 0; color: white;">
    <script>
      (function() {
        try {
          var savedTheme = localStorage.getItem('theme') || 'dark';
          if (savedTheme === 'dark') {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
    <div id="root">
      <div style="height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; font-family: sans-serif;">
        <div style="width: 40px; height: 40px; border: 3px solid rgba(255,255,255,0.1); border-radius: 50%; border-top-color: #3b82f6; animation: spin 1s linear infinite; margin-bottom: 20px;"></div>
        <p style="color: #9ca3af; font-size: 14px;" id="loading-text">Waking up Aegis Health...</p>
      </div>
    </div>
    <script>
      (function() {
        var root = document.getElementById('root');
        function fail(msg) {
          console.error("Boot message:", msg);
          if (root) {
            root.innerHTML = '<div style="padding:40px 20px;font-family:sans-serif;color:white;background:#0d0d0d;min-height:100vh;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;"><div style="background:rgba(59, 130, 246, 0.1);border:1px solid rgba(59,130,246,0.2);border-radius:16px;padding:24px;max-width:400px;width:100%;"><h2 style="color:#ef4444;margin:0 0 12px 0;">Loading</h2><p style="color:#9ca3af;line-height:1.5;margin-bottom:20px;">' + ("Taking longer than expected.") + '</p><button onclick="window.location.reload()" style="cursor:pointer;width:100%;padding:12px;background:#3b82f6;border:none;border-radius:12px;color:white;font-weight:600;">Reload</button></div></div>';
          }
        }
        window.addEventListener('error', function(e) { console.error(e) });
        window.addEventListener('unhandledrejection', function(e) { 
           console.error(e)
        });
        
        // Timeout for script loading
        setTimeout(function() {
          if (root && root.innerHTML.indexOf('Waking up') !== -1) {
            fail("The application is taking too long to load. This might be a compatibility issue with this browser version.");
          }
        }, 45000);
      })();
    </script>
    <style>
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
