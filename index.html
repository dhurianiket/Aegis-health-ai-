<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aegis Health</title>
    <link
      href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700,900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body style="background-color: #0d0d0d; margin: 0; color: white;">
    <div id="root">
      <div style="height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; font-family: sans-serif;">
        <div style="width: 40px; height: 40px; border: 3px solid rgba(255,255,255,0.1); border-radius: 50%; border-top-color: #3b82f6; animation: spin 1s linear infinite; margin-bottom: 20px;"></div>
        <p style="color: #9ca3af; font-size: 14px;" id="loading-text">Waking up Aegis Health...</p>
      </div>
    </div>
    <script>
      (function() {
        var root = document.getElementById('root');
        function fail(msg) {
          console.error("Boot message:", msg);
          if (root) {
            root.innerHTML = '<div style="padding:40px 20px;font-family:sans-serif;color:white;background:#0d0d0d;min-height:100vh;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;"><div style="background:rgba(59, 130, 246, 0.1);border:1px solid rgba(59,130,246,0.2);border-radius:16px;padding:24px;max-width:400px;width:100%;"><h2 style="color:#ef4444;margin:0 0 12px 0;">Loading</h2><p style="color:#9ca3af;line-height:1.5;margin-bottom:20px;">' + ("Taking longer than expected.") + '</p><button onclick="window.location.reload()" style="cursor:pointer;width:100%;padding:12px;background:#3b82f6;border:none;border-radius:12px;color:white;font-weight:600;">Reload</button></div></div>';
          }
        }
        window.addEventListener('error', function(e) { console.error(e) });
        window.addEventListener('unhandledrejection', function(e) { 
           console.error(e)
        });
        
        // Timeout for script loading
        setTimeout(function() {
          if (root && root.innerHTML.indexOf('Waking up') !== -1) {
            fail("The application is taking too long to load. This might be a compatibility issue with this browser version.");
          }
        }, 45000);
      })();
    </script>
    <style>
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
